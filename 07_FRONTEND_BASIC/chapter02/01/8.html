        .box:hover {
            width: 300px;

        }

        .text:focus{

        .text:blur {

        }

        .tap-group{
            width: 400px;
            display: flex;

        }

        .tap-group input[type='radio'] {

        }

        .tap-group label{
            border: 1px solid #ccc;
            padding: 20px 15px;
            margin: 0 5px;
        }

        .tap-group input[type='radio']:checked + label {
            border-color: #000;
            background: #000;
            color: #fff;
        }
