<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        a,p, .greeting{
            color: green;
        }

        span.greeting{
            color: orange;
        }

        input[type]{
            border: 3px solid red;
        }

        input[type='number']{             /*속성 선택자 : 값이 일치하는 */
            background-color: blue;
        }
        a[href^='tel']{                     /*속성 선택자 : 값으로 시작하는 */
            background: grey;
        }
        a[href$='.com']{                    /*속성 선택자 : 값으로 끝나는 */
            background: olive;
        }
        a[href$='.net']{
            background: yellow;
        }


    </style>

    <a href="https://www.naver.com">네이버</a>
    <a href="https://www.daum.net">다음</a>
    <a href="tel:"010-0000-0000">전화걸기</a>

    <p>단락</p>
    <div class="greeting">안녕하세요.</div>
    <span class="greeting">반갑습니다.</span>


    <hr>



    <input type="text">
    <input type="number">
</body>
</html>
