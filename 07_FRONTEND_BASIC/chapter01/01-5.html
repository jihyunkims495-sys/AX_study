<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>팀스파르타</title>
    </head>
    <body>
        <h1>회원 가입</h1>
        <form method="POST" action = "sign_up.html">
            이메일 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <input type="email" name="email" value="user01@test.org" required> <br>
            비밀번호 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input type="password" required> <br>
            비밀번호확인 <input type="password" required> <br>
            회원이름 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input type="text"  required> <br>
            성별 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <label>
                <input type="checkbox" name="gender" checked>여성 <!--checked 하면, 화면상에 자동 체크가 되어 있습니다. -->
                <input type="checkbox" name="gender">남성<br>
                </label>

                
            취미 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <input type="checkbox" id="hobby_python" name="hobby"><label for ="hobby_python">파이썬 공부</label>
                <input type="checkbox" id="hobby_machine" name="hobby"><label for ="hobby_machine">머신러닝 공부</label>
                <input type="checkbox" id="hobby_reading" name="hobby"><label for ="hobby_reading">독서</label><br>
                
            자기소개 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <textarea name="introduction" rows="5" cols="100" placeholder="2줄 이상 입력하세요..."></textarea><br>

            태어난연도 &nbsp;&nbsp;
            <select name="birth_year" multiple size="2">
                <option value="2020">2020년</option>
                <option value="2019">2019년</option>
                <option value="2018">2018년</option>
                <option value="2017" selected>2017년</option>
                <option value="2016">2016년</option>
            </select>
            <br>
            
            <!--<input type="submit" value="회원가입">-->
           <p><p> <button type="submit">회원가입</button></p></p>
        </form>
    </body>
</html>
