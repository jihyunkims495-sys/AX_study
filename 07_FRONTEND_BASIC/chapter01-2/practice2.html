<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>선호도 조사</h1>
    <p><span>성별:</span>
        <input type="radio" id="male" name="gender" value="m">
        <label for="male">남성</label>
            
        <input type="radio" id="female" name="gender" value="f">
        <label for="female">여성</label></p>

    <p><span>관심 취미(중복 가능): </span>
        <input type="checkbox" id="hobby1" name="hobby" value="progreming">
        <label for="hobby1">프로그래밍</label>
            
        <input type="checkbox" id="hobby2" name="hobby" value="leading">
        <label for="hobby2">독서</label>
            
        <input type="checkbox" id="hobby3" name="hobby" value="running">
        <label for="hobby3">러닝</label></p>
    <p><button type="submit">가입완료</button></p>
</body>
</html>
