<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h1>flex-shrink/flex-basis/flex-wrap 사용하기</h1>
    <h2></h2>
    <h2></h2>
    
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            margin: 0;
        }

        ul{
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid #000;
            height: 100px;
            flex-wrap: wrap;
        }


        li{
           /*min-width: 100px;
            width: 0;*/
            flex-basis: 200px;
            flex-shrink: 0;
        }



        li:nth-of-type(3n+1){
            background: red;
        
        }
        li:nth-of-type(3n+2){
            background: blue;
        
        }
        li:nth-of-type(3n){
            background: green;
        }


        .flex1{
            display: flex;
        }

    </style>



    <h3></h3>
    <ul class="flex1">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
        <li>메뉴4</li>
        <li>메뉴5</li>
        <li>메뉴6</li>
        <li>메뉴7</li>
        <li>메뉴8</li>
        <li>메뉴9</li>
        <li>메뉴10</li>
        <li>메뉴11</li>
        <li>메뉴12</li>
        <li>메뉴13</li>
        <li>메뉴14</li>
        <li>메뉴15</li>
        <li>메뉴16</li>
        <li>메뉴17</li>
        <li>메뉴18</li>
        <li>메뉴19</li>
        <li>메뉴20</li>
    </ul>

</body>
